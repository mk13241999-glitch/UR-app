name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Clean and Install
        run: flutter clean && flutter pub get

      - name: Fix NDK and Build APK
        run: |
          echo "ndkVersion = \"27.0.12077973\"" >> android/app/build.gradle
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UR-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk        uses: actions/upload-artifact@v4
        with:
          name: UR-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UR-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk          path: build/app/outputs/flutter-apk/app-debug.apk          path: build/app/outputs/flutter-apk/app-debug.apk
